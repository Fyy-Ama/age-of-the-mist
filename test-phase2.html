<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Phase 2 Tests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4e8c1;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .pass {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .fail {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .summary {
            margin-top: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Phase 2 测试报告</h1>
    <div id="results"></div>
    <div id="summary" class="summary"></div>

    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/event-bus.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/region-manager.js"></script>
    <script src="js/map-data.js"></script>
    <script src="js/item-data.js"></script>
    <script src="js/entity.js"></script>
    <script src="js/world-map.js"></script>
    <script>
        const results = [];
        let totalTests = 0;
        let passedTests = 0;

        function test(name, fn) {
            totalTests++;
            try {
                fn();
                passedTests++;
                results.push({ name, passed: true, error: null });
            } catch (error) {
                results.push({ name, passed: false, error: error.message });
            }
        }

        function assert(condition, message) {
            if (!condition) {
                throw new Error(message || 'Assertion failed');
            }
        }

        // Test 1: Collision.testAABB
        test('Collision.testAABB', () => {
            const a = { x: 0, y: 0, w: 10, h: 10 };
            const b = { x: 5, y: 5, w: 10, h: 10 };
            const c = { x: 20, y: 20, w: 10, h: 10 };
            assert(Collision.testAABB(a, b) === true, 'Overlapping should return true');
            assert(Collision.testAABB(a, c) === false, 'Non-overlapping should return false');
        });

        // Test 2: Collision.resolveMovement
        test('Collision.resolveMovement', () => {
            const entity = { x: 0, y: 0, w: 10, h: 10 };
            const obstacles = [{ x: 20, y: 0, w: 10, h: 10 }];
            Collision.resolveMovement(entity, obstacles, 25, 0);
            assert(entity.x === 0, 'Should not move through obstacle');
        });

        // Test 3: Collision.resolveMovement sliding
        test('Collision.resolveMovement sliding', () => {
            const entity = { x: 0, y: 0, w: 10, h: 10 };
            const obstacles = [{ x: 20, y: 0, w: 10, h: 10 }];
            Collision.resolveMovement(entity, obstacles, 25, 5);
            assert(entity.x === 0, 'X should be blocked');
            assert(entity.y === 5, 'Y should move (sliding)');
        });

        // Test 4: Collision.pointInAABB
        test('Collision.pointInAABB', () => {
            const rect = { x: 0, y: 0, w: 10, h: 10 };
            assert(Collision.pointInAABB(5, 5, rect) === true, 'Point inside should return true');
            assert(Collision.pointInAABB(15, 15, rect) === false, 'Point outside should return false');
        });

        // Test 5: REGIONS array exists
        test('REGIONS array exists', () => {
            assert(Array.isArray(REGIONS), 'REGIONS should be an array');
            assert(REGIONS.length === 5, 'REGIONS should have 5 regions');
        });

        // Test 6: Region definitions
        test('Region definitions', () => {
            const region = REGIONS[0];
            assert(typeof region.id === 'string', 'Region should have id');
            assert(typeof region.name === 'string', 'Region should have name');
            assert(typeof region.bounds === 'object', 'Region should have bounds');
            assert(typeof region.palette === 'object', 'Region should have palette');
        });

        // Test 7: RegionManager constructor
        test('RegionManager constructor', () => {
            const rm = new RegionManager();
            assert(rm.regions.length === 5, 'Should have 5 regions');
        });

        // Test 8: RegionManager.getRegion
        test('RegionManager.getRegion', () => {
            const rm = new RegionManager();
            const region = rm.getRegion('travelers_camp');
            assert(region !== null, 'Should find region by id');
            assert(region.name === '旅人营地', 'Should return correct region');
        });

        // Test 9: RegionManager.getAllRegions
        test('RegionManager.getAllRegions', () => {
            const rm = new RegionManager();
            const regions = rm.getAllRegions();
            assert(regions.length === 5, 'Should return all 5 regions');
        });

        // Test 10: RegionManager.getRegionAt
        test('RegionManager.getRegionAt', () => {
            const rm = new RegionManager();
            const region = rm.getRegionAt(90 * TILE_SIZE, 90 * TILE_SIZE);
            assert(region !== null, 'Should find region at coordinates');
            assert(region.id === 'travelers_camp', 'Should return correct region');
        });

        // Test 11: RegionManager.getPalette
        test('RegionManager.getPalette', () => {
            const rm = new RegionManager();
            const palette = rm.getPalette('travelers_camp');
            assert(palette !== null, 'Should return palette');
            assert(typeof palette.ground === 'string', 'Palette should have ground color');
        });

        // Test 12: generateMapData
        test('generateMapData', () => {
            const tileMap = generateMapData();
            assert(tileMap instanceof Uint8Array, 'Should return Uint8Array');
            assert(tileMap.length === WORLD_ROWS * WORLD_COLS, 'Should have correct size');
        });

        // Test 13: TILE_RENDER_INFO
        test('TILE_RENDER_INFO', () => {
            assert(typeof TILE_RENDER_INFO === 'object', 'Should be an object');
            assert(typeof TILE_RENDER_INFO[TILE_IDS.GRASS] === 'object', 'Should have GRASS info');
            assert(typeof TILE_RENDER_INFO[TILE_IDS.GRASS].color === 'string', 'Should have color');
            assert(typeof TILE_RENDER_INFO[TILE_IDS.GRASS].walkable === 'boolean', 'Should have walkable');
        });

        // Test 14: WorldMap constructor
        test('WorldMap constructor', () => {
            const rm = new RegionManager();
            const tileMap = generateMapData();
            const wm = new WorldMap(tileMap, rm);
            assert(wm.tileMap === tileMap, 'Should store tileMap');
            assert(wm.regionManager === rm, 'Should store regionManager');
        });

        // Test 15: WorldMap.getTile
        test('WorldMap.getTile', () => {
            const rm = new RegionManager();
            const tileMap = generateMapData();
            const wm = new WorldMap(tileMap, rm);
            const tile = wm.getTile(10 * TILE_SIZE, 10 * TILE_SIZE);
            assert(tile !== null, 'Should return tile');
            assert(typeof tile.color === 'string', 'Tile should have color');
            assert(typeof tile.walkable === 'boolean', 'Tile should have walkable');
        });

        // Test 16: WorldMap.getObstaclesInRect
        test('WorldMap.getObstaclesInRect', () => {
            const rm = new RegionManager();
            const tileMap = generateMapData();
            const wm = new WorldMap(tileMap, rm);
            const rect = { x: 0, y: 0, w: 100, h: 100 };
            const obstacles = wm.getObstaclesInRect(rect);
            assert(Array.isArray(obstacles), 'Should return array');
        });

        // Test 17: WorldMap object states
        test('WorldMap object states', () => {
            const rm = new RegionManager();
            const tileMap = generateMapData();
            const wm = new WorldMap(tileMap, rm);
            wm.setObjectState('test', { activated: true });
            const state = wm.getObjectState('test');
            assert(state !== null, 'Should retrieve state');
            assert(state.activated === true, 'State should be correct');
        });

        // Test 18: WorldMap export/import states
        test('WorldMap export/import states', () => {
            const rm = new RegionManager();
            const tileMap = generateMapData();
            const wm1 = new WorldMap(tileMap, rm);
            wm1.setObjectState('test', { activated: true });
            const exported = wm1.exportStates();
            
            const wm2 = new WorldMap(tileMap, rm);
            wm2.importStates(exported);
            const state = wm2.getObjectState('test');
            assert(state !== null, 'Should import state');
            assert(state.activated === true, 'Imported state should be correct');
        });

        // Display results
        const resultsDiv = document.getElementById('results');
        results.forEach(result => {
            const div = document.createElement('div');
            div.className = 'test-result ' + (result.passed ? 'pass' : 'fail');
            div.innerHTML = result.passed 
                ? `✓ ${result.name}`
                : `✗ ${result.name}: ${result.error}`;
            resultsDiv.appendChild(div);
        });

        const summaryDiv = document.getElementById('summary');
        summaryDiv.innerHTML = `总计: ${totalTests} | 通过: ${passedTests} | 失败: ${totalTests - passedTests}`;
        summaryDiv.style.color = passedTests === totalTests ? '#155724' : '#721c24';

        console.log(`Phase 2 Tests: ${passedTests}/${totalTests} passed`);
    </script>
</body>
</html>
